<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assistant unmount harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement, StrictMode } from 'react';
      import { createRoot } from 'react-dom/client';
      import { AssistantSessionProvider } from '/src/features/assistant/assistant-session.tsx';
      import { AssistantView } from '/src/features/assistant/assistant-view.tsx';
      import '/src/styles/base.css';

      const root = createRoot(document.getElementById('root'));
      root.render(createElement(StrictMode, null,
        createElement(AssistantSessionProvider, null, createElement(AssistantView))));
      window.unmountAssistant = () => root.unmount();
    </script>
  </body>
</html>
